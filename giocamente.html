<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<title>GiocaMente — giochi per la mente (3 anni)</title>
<style>
/* =========================================================
   GiocaMente — motore di mini-giochi cognitivi per 3 anni
   Vincoli di design applicati (vedi note in fondo al file):
   - target tap >= ~2cm  ->  --tap min 104px
   - solo TAP: nessun drag, nessun multi-touch, nessun timer
   - nessuno stato di fallimento: tentativi illimitati + aiuto
   - feedback esagerato: visivo + sonoro + vocale
   ========================================================= */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Baloo 2",Nunito,"Trebuchet MS",Verdana,system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 15% -10%, #ffe9c7 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #d9f2ff 0%, transparent 55%),
    #fff7ed;
  color:#2b2118;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
:root{
  --tap: clamp(104px, 23vmin, 190px);      /* >= 2cm x 2cm su tutti i display */
  --mcard: clamp(84px, 20vmin, 160px);
  --gt: clamp(150px, 34vmin, 240px);       /* tessera di un gioco in home */
  --gap: clamp(12px, 3vmin, 26px);
  --r: 26px;
  --ink:#2b2118;
  --c1:#ffb703; --c2:#3aa8ff; --c3:#34d399; --c4:#f76c8c; --c5:#a78bfa; --c6:#fb8500;
  --shadow: 0 10px 0 rgba(0,0,0,.10), 0 14px 26px rgba(0,0,0,.12);
}

/* ---------- layout ---------- */
#app{height:100dvh;display:flex;flex-direction:column}
#hud{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:max(8px,env(safe-area-inset-top)) 14px 8px;
}
#screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 14px 14px}

/* ---------- controlli adulti (piccoli di proposito) ---------- */
.iconbtn{
  position:relative;width:60px;height:60px;flex:0 0 auto;
  border:0;border-radius:20px;background:#fff;box-shadow:var(--shadow);
  font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:transform .12s ease;
}
.iconbtn:active{transform:translateY(3px);box-shadow:0 6px 0 rgba(0,0,0,.10)}
.iconbtn.lang{font-size:19px;font-weight:900;letter-spacing:.02em;color:var(--ink)}
/* due emoji (ingranaggio + genitori) nello stesso bottone: niente a capo, un filo più piccole */
.iconbtn.gear{font-size:20px;white-space:nowrap;letter-spacing:-2px}
/* con cinque comandi in barra i telefoni stretti vanno in overflow */
@media (max-width:430px){
  #hud{gap:8px;padding-inline:10px}
  .iconbtn{width:52px;height:52px;border-radius:17px;font-size:23px}
  .iconbtn.lang{font-size:17px}
  .iconbtn.gear{font-size:17px}
  #stars{padding:8px 12px;font-size:clamp(18px,4vmin,24px)}
}
.iconbtn.holding::after{
  content:"";position:absolute;inset:-4px;border-radius:24px;
  border:5px solid var(--c2);clip-path:inset(0 0 0 0);
  animation:holdfill 1.2s linear forwards;
}
@keyframes holdfill{from{opacity:.15;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
#stars{
  margin-left:auto;background:#fff;border-radius:20px;box-shadow:var(--shadow);
  padding:10px 18px;font-size:clamp(20px,4vmin,28px);font-weight:800;white-space:nowrap
}

/* ---------- mascotte (Bubo) ---------- */
.mascot{
  border:0;background:none;padding:0;margin:0;cursor:pointer;flex:0 0 auto;
  width:var(--msize,64px);height:var(--msize,64px);display:block;
  -webkit-tap-highlight-color:transparent;
}
.mascot svg{width:100%;height:100%;display:block;overflow:visible}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.4s ease-in-out infinite}
.mascot .eye.r{animation-delay:.04s}
.mascot:active{transform:scale(.94)}
.mascot.big{--msize:clamp(78px,17vmin,132px)}
.mascot.mini{--msize:clamp(42px,8.4vmin,64px)}
.mascot.huge{--msize:clamp(96px,24vmin,170px);margin:0 auto}
.mascot.happy{animation:mbounce .85s ease}
.mascot.happy .eye{animation:msquint .85s ease}
.mascot.oops{animation:mtilt .6s ease}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes msquint{0%,100%{transform:scaleY(1)}30%,70%{transform:scaleY(.35)}}
@keyframes mbounce{0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-16%) rotate(-7deg)}
  55%{transform:translateY(-6%) rotate(6deg)}
  80%{transform:translateY(-2%) rotate(-2deg)}}
@keyframes mtilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}65%{transform:rotate(7deg)}}

/* fumetto della mascotte in home */
.hello{display:flex;align-items:center;justify-content:center;gap:12px;max-width:96vw;margin-bottom:6px}
.bubble{
  position:relative;background:#fff;border-radius:20px;box-shadow:var(--shadow);
  padding:12px 18px;font-size:clamp(16px,3.2vmin,23px);font-weight:800;line-height:1.25;
  max-width:min(420px,62vw);text-align:left
}
.bubble::before{
  content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
  border:10px solid transparent;border-right-color:#fff;border-left:0
}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.logo{
  margin:0;font-size:clamp(34px,8vmin,64px);font-weight:900;letter-spacing:-1px;
  background:linear-gradient(90deg,var(--c4),var(--c6),var(--c1),var(--c3),var(--c2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
/* Due colonne fino al tablet, quattro sui display larghi: mai una riga
   da tre con un gioco orfano sotto. La larghezza è calcolata sulle
   tessere, così la regola resta valida aggiungendo altri giochi. */
.gamegrid{
  display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);
  width:100%;overflow-y:auto;padding:6px;
  max-width:calc(2 * var(--gt) + var(--gap) + 14px)
}
@media (min-width:1120px){
  .gamegrid{max-width:calc(4 * var(--gt) + 3 * var(--gap) + 14px)}
}
.gtile{
  position:relative;
  width:var(--gt);min-height:clamp(150px,30vmin,220px);
  border:0;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:16px;cursor:pointer;transition:transform .14s ease;
  border-bottom:8px solid var(--tint);
}
.gtile.played{filter:saturate(.4);opacity:.8}
.gtile.played::after{content:"✅";position:absolute;top:10px;right:12px;font-size:clamp(20px,4vmin,30px)}
.gtile .done{font-size:clamp(13px,2.4vmin,16px);font-weight:800;color:var(--c6)}
.gtile:active{transform:scale(.95)}
.gtile .em{font-size:clamp(48px,10vmin,76px);line-height:1}
.gtile .nm{font-size:clamp(17px,3.4vmin,24px);font-weight:800;color:var(--ink);text-align:center}

/* ---------- stage di gioco ---------- */
.stage{flex:1;display:flex;flex-direction:column;min-height:0;gap:10px}
.promptbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 16px;
}
#prompt{font-size:clamp(19px,3.8vmin,30px);font-weight:800;line-height:1.15}
.play{
  flex:1 1 auto;min-height:0;display:flex;flex-wrap:wrap;align-content:center;
  align-items:center;justify-content:center;gap:var(--gap);padding:6px;overflow:auto
}
.dots{flex:0 0 auto;display:flex;justify-content:center;gap:10px;padding:4px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.14)}
.dot.on{background:var(--c1);box-shadow:0 0 0 4px rgba(255,183,3,.25)}

/* ---------- tessere di risposta ---------- */
.tile{
  width:var(--tap);height:var(--tap);border:5px solid transparent;border-radius:var(--r);
  background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;
  padding:12px;cursor:pointer;transition:transform .14s ease, opacity .3s ease;
}
.tile:active{transform:scale(.94)}
.tile svg{width:100%;height:100%;display:block}
.tile .face{font-size:clamp(42px,10vmin,84px);line-height:1}
.tile.dim{opacity:.3}
.tile.right{border-color:var(--c1);animation:pop .5s ease}
.tile.wrong{animation:wob .45s ease}
.tile.hint{animation:hint 1.1s ease-in-out infinite}

/* ---------- filastrocche: tessere-parola + conferma verde ---------- */
/* più larghe che alte: una parola respira, e l'altezza resta >= 2cm */
.tile.wtile{width:calc(var(--tap)*1.3)}
.tile .word{font-size:clamp(19px,4vmin,34px);font-weight:900;text-align:center;line-height:1.15}
.tile.sel{border-color:var(--c2)}
.gobtn{
  width:calc(var(--tap)*1.3);height:var(--tap);border:0;border-radius:var(--r);
  background:var(--c3);color:#fff;font-size:clamp(44px,10vmin,80px);font-weight:900;line-height:1;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .14s ease,opacity .3s ease;
}
.gobtn:active{transform:scale(.94)}
.gobtn.dim{opacity:.3}
/* Il modello deve leggersi subito come "l'esempio da guardare", mai come
   una delle risposte: sfondo crema (le risposte sono bianche), tratteggio
   più marcato, occhietti sopra e molto più aria prima delle tessere. */
.model{
  position:relative;
  width:calc(var(--tap)*1.05);height:calc(var(--tap)*1.05);
  border-radius:var(--r);background:#fff6da;border:6px dashed rgba(0,0,0,.22);
  display:grid;place-items:center;padding:14px;
  margin-bottom:calc(var(--gap)*2.6);       /* ben staccato dalle tessere sotto: è il modello, non una scelta */
}
.model::after{
  content:"👀";position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:999px;padding:3px 11px;font-size:19px;line-height:1;
  box-shadow:var(--shadow);
}
.model svg{width:100%;height:100%}
.row{flex-basis:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}

/* ---------- conteggio ---------- */
.pips{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pip{width:clamp(20px,4.2vmin,34px);height:clamp(20px,4.2vmin,34px);border-radius:50%;background:var(--c4)}
.items{display:flex;flex-wrap:wrap;gap:4%;justify-content:center;align-items:center;width:100%;height:100%}
.items span{font-size:clamp(24px,6.2vmin,52px);line-height:1}

/* ---------- conta oltre 10: dieci già "fermi" (ten-frame) + il resto da toccare e contare ---------- */
.c10board{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(92vw,460px)}
.c10anchor{
  position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  background:#fff6da;border:4px solid var(--c1);border-radius:18px;padding:16px 14px 12px;
}
.c10anchor .pip{width:clamp(16px,3.4vmin,26px);height:clamp(16px,3.4vmin,26px);background:var(--c1)}
.c10anchor::after{
  content:"10";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  background:var(--c1);color:#fff;font-weight:900;font-size:14px;line-height:1;
  border-radius:10px;padding:4px 10px;box-shadow:var(--shadow)
}
.c10extra{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.c10pip{
  width:clamp(48px,10vmin,74px);height:clamp(48px,10vmin,74px);border-radius:50%;
  border:5px solid var(--c5);background:#fff;cursor:pointer;transition:transform .14s ease;
}
.c10pip:active{transform:scale(.9)}
.c10pip.done{background:var(--c5);animation:pop .4s ease}
.c10count{font-size:clamp(30px,7.5vmin,52px);font-weight:900;color:var(--c5);min-height:1.2em}
.tile.c10choice{animation:pop .4s ease}

/* ---------- memory ---------- */
.mgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);
  --cols:4;max-width:min(96vw, calc(var(--cols) * var(--mcard) + (var(--cols) - 1) * var(--gap)))}
.mcard{width:var(--mcard);height:var(--mcard);perspective:800px;cursor:pointer;background:none;border:0;padding:0}
.mface{
  display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .38s cubic-bezier(.34,1.4,.5,1);border-radius:var(--r);
}
.mcard.up .mface,.mcard.done .mface{transform:rotateY(180deg)}
.mside{
  position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;
  -webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--shadow);
  font-size:clamp(38px,9.5vmin,78px);
}
.mback{background:linear-gradient(150deg,var(--c2),#7cc9ff);color:#fff;font-size:clamp(30px,7vmin,58px)}
.mfront{background:#fff;transform:rotateY(180deg);border:5px solid var(--c1)}
.mcard.done{animation:pop .5s ease}
.mcard.done .mfront{border-color:var(--c3);background:#eafff4}
.mcard:active .mface{transform:scale(.95)}
.mcard.up:active .mface,.mcard.done:active .mface{transform:rotateY(180deg) scale(.95)}

/* ---------- effetti ---------- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.stamp{
  position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  font-size:clamp(90px,26vmin,220px);animation:stamp .9s ease forwards
}
.conf{
  position:absolute;top:-24px;width:14px;height:22px;border-radius:3px;
  animation:fall 1.8s linear forwards
}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.9}}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  75%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}
  45%{transform:translateX(10px)}70%{transform:translateX(-6px)}}
@keyframes hint{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 10px rgba(255,183,3,.45),var(--shadow)}}

/* ---------- overlay finale / genitori ---------- */
.sheet{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:rgba(30,20,10,.45);backdrop-filter:blur(3px);padding:20px
}
.sheetbox{
  background:#fff;border-radius:32px;box-shadow:0 24px 60px rgba(0,0,0,.3);
  padding:clamp(20px,5vmin,40px);text-align:center;max-width:560px;width:100%;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch
}
.sheetbox h2{margin:0 0 6px;font-size:clamp(26px,6vmin,44px)}
.sheetbox p{margin:0 0 18px;font-size:clamp(16px,3.2vmin,22px);opacity:.75}
.bigbtn{
  border:0;border-radius:22px;padding:18px 26px;margin:6px;cursor:pointer;
  font-size:clamp(18px,3.6vmin,26px);font-weight:800;color:#fff;box-shadow:var(--shadow);
  min-width:180px;min-height:72px
}
.bigbtn:active{transform:translateY(3px)}
.bigbtn.a{background:var(--c3)} .bigbtn.b{background:var(--c2)}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 4px;border-bottom:1px solid rgba(0,0,0,.08);font-size:18px;font-weight:700;text-align:left}
.optrow:last-of-type{border-bottom:0}
.sw{width:74px;height:42px;border-radius:22px;border:0;background:#d6d3d1;position:relative;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;
  background:#fff;transition:left .18s ease}
.sw.on{background:var(--c3)} .sw.on::after{left:36px}
.techrow{padding:10px 4px;border-bottom:1px solid rgba(0,0,0,.08);text-align:left}
.techrow:last-of-type{border-bottom:0}
.techhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:700;margin-bottom:6px}
.techctl{display:flex;align-items:center;gap:10px}
.testbtn{border:0;border-radius:14px;padding:8px 14px;font-size:15px;font-weight:800;
  background:var(--c1);color:#fff;cursor:pointer;flex:0 0 auto;min-height:40px;white-space:nowrap}
.testbtn:active{transform:translateY(2px)}
.voicesel{flex:1 1 auto;min-width:0;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.15);
  padding:0 8px;font-size:15px;font-family:inherit;background:#fff;color:inherit}
.nameinput{width:100%;height:44px;border-radius:12px;border:1px solid rgba(0,0,0,.15);
  padding:0 12px;font-size:16px;font-family:inherit;background:#fff;color:inherit}
.agegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.agebtn{border:2px solid rgba(0,0,0,.12);background:#fff;border-radius:16px;padding:10px 6px;
  cursor:pointer;font-family:inherit;text-align:center;color:inherit}
.agebtn b{display:block;font-size:15px;font-weight:800}
.agebtn span{display:block;font-size:12px;font-weight:700;opacity:.6;margin-top:2px}
.agebtn.sel{border-color:var(--c3);background:#eafff4}
.note{font-size:14px;opacity:.6;text-align:left;margin-top:14px;line-height:1.45}

/* schermi bassi (telefono in landscape): modello e risposte su un'unica riga,
   lo stacco dal modello passa quindi dal basso al lato destro */
@media (max-height:520px){
  .row{flex-basis:auto}
  .model{width:var(--tap);height:var(--tap);margin:0 calc(var(--gap)*1.8) 0 0}
}
/* schermi stretti: carte memory più grandi, la griglia passa a 3 colonne via JS */
@media (max-width:520px){
  :root{--mcard: clamp(100px, 27vw, 160px)}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <button id="btnHome" class="iconbtn" aria-label="Torna ai giochi">🏠</button>
    <button id="btnRepeat" class="iconbtn" aria-label="Ripeti la richiesta">🔊</button>
    <div id="stars">⭐ <span id="starcount">0</span></div>
    <button id="btnLang" class="iconbtn lang" aria-label="Cambia lingua">EN</button>
    <button id="btnGear" class="iconbtn gear" aria-label="Impostazioni (tieni premuto per 1,2 secondi)">⚙️👫</button>
  </header>
  <main id="screen"></main>
</div>
<div id="fx"></div>

<script>
"use strict";

/* =========================================================
   1. UTILITY
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const sleep   = ms => new Promise(r => setTimeout(r, ms));
const rnd     = n => Math.floor(Math.random() * n);
const pick    = a => a[rnd(a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const range   = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };

/* =========================================================
   1a. LINGUA — italiano se il dispositivo è in italiano,
       inglese in tutti gli altri casi. Tutto il testo visibile
       e parlato passa da T (STR[LANG]).
   ---------------------------------------------------------
   La scelta fatta col tasto in barra vince sempre sulla
   rilevazione automatica e viene ricordata: il caso che conta
   è il dispositivo configurato in una lingua e il bambino che
   ne parla un'altra, e lì ri-sceglierla a ogni sessione sarebbe
   una seccatura. LANG e T cambiano a runtime: nessun ricaricamento.
   ========================================================= */
const LangPref = {
  key: "giocamente_lang",
  get() { try { const v = localStorage.getItem(this.key); return (v === "it" || v === "en") ? v : null; } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(this.key, v); } catch (e) {} }
};
function detectLang() {
  const l = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  return (l === "it" || l.indexOf("it-") === 0) ? "it" : "en";
}
let LANG = LangPref.get() || detectLang();

const STR = {
  it: {
    docTitle: "GiocaMente — giochi per la mente (3 anni)",
    ariaHome: "Torna ai giochi", ariaRepeat: "Ripeti la richiesta", ariaGear: "Impostazioni (tieni premuto per 1,2 secondi)",
    ariaMascot: "Bubo — tocca per riascoltare",
    ariaLang: "Passa all'inglese", langSet: "Ho cambiato lingua. Ora parlo italiano.",
    speechLang: "it-IT", voiceName: /italian/i, preferredVoiceName: /alice/i,
    praise: ["Bravo!", "Benissimo!", "Sì, giusto!", "Perfetto!", "Che bravo!"],

let T = STR[LANG];

/** Cambia lingua a caldo: stringhe, voce, titoli, attributi. */
function applyLang(code) {
  if (code !== "it" && code !== "en") return;
  LANG = code; T = STR[code];
  LangPref.set(code);
  document.documentElement.lang = code;
  document.title = T.docTitle;
  $("#btnHome").setAttribute("aria-label", T.ariaHome);
  $("#btnRepeat").setAttribute("aria-label", T.ariaRepeat);
  $("#btnGear").setAttribute("aria-label", T.ariaGear);
  syncLangBtn();
  Voice.pick();            // riseleziona la voce del dispositivo per la nuova lingua
  Voice.stop();
  renderHome();            // una partita in corso aveva consegne nella lingua vecchia
}

/** Il tasto mostra la lingua verso cui si passa, non quella attiva. */
function syncLangBtn() {
  const b = $("#btnLang"); if (!b) return;
  b.textContent = (LANG === "it" ? "en" : "it").toUpperCase();
  b.setAttribute("aria-label", T.ariaLang);
}

/* Stato di sessione: stelle e impostazioni audio restano in memoria, si azzerano al reload. */
const S = {
  stars: 0, sound: true, voice: true, token: null, resolve: null,
  soundVolume: 1, voiceRate: .92, voicePitch: 1.15, voiceVolume: 1
};

/* =========================================================
   1b. CAP GIORNALIERO — una partita al giorno per gioco
   ---------------------------------------------------------
   Dato persistito (localStorage, solo sul dispositivo):
   { cap: bool, date: "YYYY-MM-DD", played: [id, ...] }
   Se localStorage non è disponibile degrada in memoria:
   il cap vale allora solo per la sessione corrente.
   ========================================================= */
const Daily = {
  key: "giocamente_daily", mem: null,
  today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  },
  load() {
    if (!this.mem) {
      let d = null;
      try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) {}
      if (!d || typeof d !== "object") d = { cap: true, date: this.today(), played: [] };
      if (typeof d.cap !== "boolean") d.cap = true;
      if (!Array.isArray(d.played)) d.played = [];
      this.mem = d;
    }
    if (this.mem.date !== this.today()) {          // nuovo giorno: si riparte
      this.mem.date = this.today(); this.mem.played = []; this.save();
    }
    return this.mem;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.mem)); } catch (e) {} },
  isLocked(id) { const d = this.load(); return d.cap && d.played.indexOf(id) !== -1; },
  markPlayed(id) { const d = this.load(); if (d.played.indexOf(id) === -1) { d.played.push(id); this.save(); } },
  unlockToday() { const d = this.load(); d.played = []; this.save(); },
  setCap(v) { const d = this.load(); d.cap = v; this.save(); }
};

/* =========================================================
   1c. PROFILO BAMBINO — nome (facoltativo) ed età
   ---------------------------------------------------------
   Dato persistito (localStorage, solo sul dispositivo):
   { name: string, age: "" | "u36" | "y36" | "y42" | "y48" }
   L'età scelta imposta il livello minimo da cui parte ogni
   gioco (vedi startGame): con un bambino più grande si può
   saltare i round introduttivi più facili. Il nome, se dato,
   sostituisce il saluto generico della mascotte.
   ========================================================= */
const AGE_BANDS = [
  { id: "u36", minLevel: 1, labelKey: "age1L", subKey: "age1S" },
  { id: "y36", minLevel: 1, labelKey: "age2L", subKey: "age2S" },
  { id: "y42", minLevel: 2, labelKey: "age3L", subKey: "age3S" },
  { id: "y48", minLevel: 3, labelKey: "age4L", subKey: "age4S" }
];
const Profile = {
  key: "giocamente_profile", mem: null,
  load() {
    if (!this.mem) {
      let d = null;
      try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) {}
      if (!d || typeof d !== "object") d = { name: "", age: "", onboarded: false };
      if (typeof d.name !== "string") d.name = "";
      if (!AGE_BANDS.some(b => b.id === d.age)) d.age = "";
      if (typeof d.onboarded !== "boolean") d.onboarded = false;
      this.mem = d;
    }
    return this.mem;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.mem)); } catch (e) {} },
  setName(n) { const d = this.load(); d.name = String(n || "").slice(0, 24); this.save(); },
  setAge(id) { const d = this.load(); d.age = AGE_BANDS.some(b => b.id === id) ? id : ""; this.save(); },
  minLevel() { const b = AGE_BANDS.find(x => x.id === this.load().age); return b ? b.minLevel : 1; },
  /** true finché il dispositivo non ha mai visto la schermata di benvenuto: un cookie/localStorage
      nuovo (o svuotato) la fa ricomparire, così a un nuovo dispositivo si richiede di nuovo nome ed età. */
  isOnboarded() { return this.load().onboarded; },
  setOnboarded() { const d = this.load(); d.onboarded = true; this.save(); }
};

/** Saluto della mascotte: usa il nome se i genitori l'hanno inserito. */
function greetLine() {
  const nm = Profile.load().name.trim();
  return nm ? T.hiName(nm) : pick(T.mascotHi);
}

/** Lode dopo una risposta giusta: usa il nome del bambino se i genitori l'hanno inserito. */
function praiseText() {
  const nm = Profile.load().name.trim();
  return nm ? pick(T.praiseName(nm)) : pick(T.praise);
}

/* =========================================================
   2. AUDIO — sintesi WebAudio, zero file esterni
   ========================================================= */
const Sound = {
  ac: null,
  ctx() {
    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ac.state === "suspended") this.ac.resume();
    return this.ac;
  },
  tone(freq, dur = .18, type = "sine", gain = .16, delay = 0) {
    if (!S.sound) return;
    this.raw(freq, dur, type, gain, delay);
  },
  /** Come tone(), ma ignora l'interruttore: serve al tasto "Prova" del volume. */
  raw(freq, dur = .18, type = "sine", gain = .16, delay = 0) {
    const ac = this.ctx(); if (!ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    const peak = Math.max(0.0001, gain * S.soundVolume);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + .02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  },
  tap()  { this.tone(760, .09, "triangle", .10); },
  flip() { this.tone(540, .12, "triangle", .11); },
  good() { [523.25, 659.25, 783.99].forEach((f, i) => this.tone(f, .24, "sine", .15, i * .09)); },
  win()  { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => this.tone(f, .32, "sine", .15, i * .11)); },
  nope() { this.tone(300, .16, "sine", .09); this.tone(245, .22, "sine", .08, .14); }  // morbido, mai punitivo
};

/* =========================================================
   2b. VERSI DEGLI ANIMALI — sintesi WebAudio, zero file esterni
   ---------------------------------------------------------
   Prima il verso era solo la sintesi vocale che leggeva
   l'onomatopea ("Bau bau!"): comprensibile, ma poco credibile.
   Qui ogni animale ha una piccola "ricetta" di oscillatori e
   rumore filtrato che imita il verso vero (abbaio, miagolio,
   muggito...), sempre senza file audio e senza rete.
   play() ritorna la durata in secondi, così la voce può fare
   la domanda DOPO il verso, senza parlargli sopra.
   ========================================================= */
const Critter = {
  play(name) {
    if (!S.sound) return 0;                       // suoni spenti: si torna alla sola onomatopea parlata
    const ac = Sound.ctx(); if (!ac) return 0;
    const r = this.recipes[name]; if (!r) return 0;
    return r.call(this, ac, ac.currentTime + .04, .5 * S.soundVolume);
  },
  /** Oscillatore con glissando f0->f1 ed eventuali vibrato, tremolo e filtro. */
  seg(ac, t0, dur, f0, f1, type, vol, o) {
    o = o || {};
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, f0), t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    if (o.vib) {                                  // vibrato: LFO sulla frequenza [rate, profondità]
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start(t0); lfo.stop(t0 + dur);
    }
    let head = osc;
    if (o.f) {                                    // filtro [tipo, frequenza, Q]
      const bi = ac.createBiquadFilter();
      bi.type = o.f[0]; bi.frequency.value = o.f[1]; bi.Q.value = o.f[2] || 1;
      head.connect(bi); head = bi;
    }
    const peak = Math.max(.0001, vol);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + (o.a || .03));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    if (o.am) {                                   // tremolo: LFO sul volume (rana, ape)
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = o.am; lg.gain.value = peak * .8;
      lfo.connect(lg); lg.connect(g.gain);
      lfo.start(t0); lfo.stop(t0 + dur);
    }
    head.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + .05);
  },
  /** Rumore bianco filtrato: soffi, raspi, ringhi. */
  noise(ac, t0, dur, vol, o) {
    o = o || {};
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const bi = ac.createBiquadFilter();
    bi.type = (o.f && o.f[0]) || "bandpass";
    bi.frequency.value = (o.f && o.f[1]) || 1000;
    bi.Q.value = (o.f && o.f[2]) || 1;
    const g = ac.createGain();
    const peak = Math.max(.0001, vol);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + (o.a || .02));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bi); bi.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0 + dur + .05);
  },
  recipes: {
    dog(ac, t, v) {                               // due abbai secchi
      [0, .32].forEach(d => {
        this.seg(ac, t + d, .16, 260, 130, "sawtooth", v, { f: ["bandpass", 500, 2], a: .01 });
        this.noise(ac, t + d, .12, v * .5, { f: ["bandpass", 900, 1] });
      });
      return .8;
    },
    cat(ac, t, v) {                               // "miao": sale e ridiscende
      this.seg(ac, t, .28, 430, 800, "triangle", v * .9, { vib: [7, 25] });
      this.seg(ac, t + .26, .4, 800, 430, "triangle", v * .9, { vib: [7, 25], a: .05 });
      return .95;
    },
    cow(ac, t, v) {                               // muggito lungo e basso
      this.seg(ac, t, 1, 140, 85, "sawtooth", v, { f: ["lowpass", 320, 1], vib: [5, 6], a: .1 });
      return 1.3;
    },
    sheep(ac, t, v) {                             // belato tremolante
      this.seg(ac, t, .75, 500, 370, "sawtooth", v * .8, { vib: [8, 55], f: ["bandpass", 800, 1.5], a: .06 });
      return 1.05;
    },
    duck(ac, t, v) {                              // tre "qua" nasali
      [0, .22, .44].forEach(d =>

   ---------------------------------------------------------
   Stessa idea dei versi degli animali (sezione 2b), stessi
   mattoni (seg e noise, presi in prestito da Critter: non
   usano `this`): ogni strumento ha una piccola ricetta che ne
   imita il timbro — colpo di tamburo, rintocco, squillo di
   tromba... play() ritorna la durata in secondi, così la voce

const Orchestra = {
  seg: Critter.seg, noise: Critter.noise,
  play(name) {
    if (!S.sound) return 0;                       // suoni spenti: resta l'onomatopea letta dalla voce
    const ac = Sound.ctx(); if (!ac) return 0;
    const r = this.recipes[name]; if (!r) return 0;
    return r.call(this, ac, ac.currentTime + .04, .5 * S.soundVolume);
  },
  recipes: {
    drum(ac, t, v) {                              // tre colpi: pelle bassa + colpetto secco
      [0, .32, .64].forEach(d => {
        this.seg(ac, t + d, .22, 160, 55, "sine", v * 1.2, { a: .005 });

    },
    bell(ac, t, v) {                              // due rintocchi: fondamentale + parziale acuta che sfuma
      [0, .5].forEach(d => {

    trumpet(ac, t, v) {                           // squillo: due note corte e una lunga, timbro d'ottone

      this.seg(ac, t + .44, .6, 784, 784, "sawtooth", v * .9, { f: ["bandpass", 1100, 1], vib: [6, 7], a: .03 });
      return 1.25;
    },
    piano(ac, t, v) {                             // arpeggio "plin plon": attacco netto, ottava che accompagna
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        this.seg(ac, t + i * .19, .5, f, f, "triangle", v * .9, { a: .005 });
        this.seg(ac, t + i * .19, .3, f * 2, f * 2, "sine", v * .25, { a: .005 });

    guitar(ac, t, v) {                            // pennata: cinque corde a scalare che risuonano

    sax(ac, t, v) {                               // frase morbida con un filo di soffio
      const o = { f: ["lowpass", 1500, 2], vib: [5, 6], a: .05 };
      this.seg(ac, t, .24, 294, 294, "sawtooth", v * .8, o);
      this.seg(ac, t + .28, .24, 370, 370, "sawtooth", v * .8, o);
      this.seg(ac, t + .56, .55, 440, 440, "sawtooth", v * .8, o);

      [261.6, 329.6, 392].forEach(f => {

        this.seg(ac, t, 1, f * 1.006, f * 1.006, "square", v * .16, { f: ["lowpass", 2400, 1], a: .1 });

/* =========================================================
   3. VOCE — Web Speech API nella lingua rilevata
   ========================================================= */
const Voice = {
  v: null, overrideURI: null, bound: false, ok: ("speechSynthesis" in window),
  init() {
    if (!this.ok) return;
    this.pick();
    if (!this.bound) {                      // un solo listener, anche cambiando lingua più volte
      this.bound = true;
      speechSynthesis.addEventListener("voiceschanged", () => this.pick());
    }
  },
  /** Sceglie la voce del dispositivo per la lingua attiva, rispettando la scelta manuale in area genitori.
      Fra le voci della lingua attiva preferisce quella con il nome indicato in T.preferredVoiceName
      (Alice per l'italiano, Samantha per l'inglese), se il dispositivo la offre. */
  pick() {
    if (!this.ok) return;
    const list = speechSynthesis.getVoices() || [];
    if (this.overrideURI) {
      const chosen = list.find(x => x.voiceURI === this.overrideURI);
      if (chosen) { this.v = chosen; return; }
    }
    const langRe = new RegExp("^" + LANG + "[-_]?", "i");
    const langMatches = list.filter(x => langRe.test(x.lang));
    this.v = langMatches.find(x => T.preferredVoiceName.test(x.name)) ||
      langMatches[0] || list.find(x => T.voiceName.test(x.name)) || null;
  },
  /** Imposta la voce scelta a mano dal genitore (voiceURI), o torna alla scelta automatica se vuoto. */
  setVoice(uri) { this.overrideURI = uri || null; this.pick(); },
  /** Voci disponibili sul dispositivo per la lingua attiva, quelle più pertinenti per prime. */
  list() {
    if (!this.ok) return [];
    const langRe = new RegExp("^" + LANG + "[-_]?", "i");
    return (speechSynthesis.getVoices() || []).slice().sort((a, b) => {
      const am = langRe.test(a.lang) ? 0 : 1, bm = langRe.test(b.lang) ? 0 : 1;
      return am !== bm ? am - bm : a.name.localeCompare(b.name);
    });
  },
  /** done() viene richiamato a fine frase — o subito, se la voce non c'è.
      Serve al motore per non cambiare turno mentre sta ancora parlando. */
  say(text, done) {
    if (!S.voice) { if (done) done(); return; }
    this.speak(text, done);
  },
  /** Come say(), ma ignora l'interruttore: usato dal tasto "Prova" in area genitori. */
  speak(text, done) {
    let fired = false;
    const end = () => { if (fired) return; fired = true; if (done) done(); };
    if (!this.ok || !text) return end();
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = T.speechLang; if (this.v) u.voice = this.v;
      u.rate = S.voiceRate; u.pitch = S.voicePitch; u.volume = S.voiceVolume;
      u.onend = end; u.onerror = end;
      speechSynthesis.speak(u);
    } catch (e) { end(); /* voce non disponibile: si continua coi soli suoni */ }
  },
  /** Frase di prova con le impostazioni correnti, anche a voce spenta. */
  test() { this.speak(T.pTestSample); },
  stop() { if (this.ok) { try { speechSynthesis.cancel(); } catch (e) {} } }
};

const KidBrain = {

/* =========================================================
   5a. LIVELLO ADATTIVO — il principio dei test adattivi
       (GMAT), tradotto a misura di bambino
   ---------------------------------------------------------
   Il livello non sale più col numero del turno ma con le
   risposte: come nel GMAT, rispondere bene porta a domande
   più difficili, andare in difficoltà a domande più facili.
   - 2 risposte esatte al primo tocco di fila -> livello +1
   - un errore nel turno -> livello mantenuto, serie azzerata
   - aiuto acceso (2+ errori nel turno) -> livello -1
   La discesa è invisibile al bambino (nessun messaggio, nessun
   punteggio): resta coerente con "nessuno stato di fallimento",
   semplicemente il turno dopo è più abbordabile.
   Il progresso resta in memoria fra una partita e l'altra della
   stessa sessione (come le stelle): con pochi turni a partita,
   azzerarlo a ogni "Ancora" renderebbe i livelli alti
   irraggiungibili. A inizio partita risale comunque almeno alla
   fascia d'età scelta dai genitori (Profile.minLevel(), che può
   cambiare a sessione in corso), senza mai abbassare un livello
   già guadagnato giocando.
   Ogni gioco può dichiarare maxLevel (default 3): serve a
   "Trova l'uguale", che ha 5 gradini di difficoltà.
   ========================================================= */
const Adaptive = {
  state: {},                                  // id gioco -> { level, streak }
  UP_STREAK: 2,                               // esatte al primo tocco per salire
  maxFor(game) { return game.maxLevel || 3; },
  get(game) {
    let st = this.state[game.id];
    if (!st) st = this.state[game.id] = { level: 1, streak: 0 };
    return st;
  },
  /** Da chiamare a inizio partita: applica la fascia d'età e azzera la serie. */
  begin(game) {
    const st = this.get(game);
    st.level = Math.min(this.maxFor(game), Math.max(st.level, Profile.minLevel()));
    st.streak = 0;
    return st;
  },
  /** Da chiamare a fine turno con gli errori fatti (0 = giusto al primo tocco). */
  update(game, wrongs) {
    const st = this.get(game);
    if (wrongs === 0) {
      st.streak++;
      if (st.streak >= this.UP_STREAK) {
        st.level = Math.min(this.maxFor(game), st.level + 1);
        st.streak = 0;
      }
    } else {
      st.streak = 0;
      if (wrongs >= 2) st.level = Math.max(1, st.level - 1);
    }
  }
};

/* Se il bambino non tocca nulla, la consegna viene ripetuta ogni 9 s.
   "Non tocca nulla" va preso alla lettera: ogni tocco nell'area di gioco
   riparte il conto alla rovescia (vedi startGame), altrimenti il ripasso
   scatterebbe anche mentre il bambino sta giocando — ad esempio mentre
   conta i pallini uno alla volta in "Conta oltre 10". */
let idleTimer = null;
function armIdle(fn) {
  clearInterval(idleTimer);
  if (fn) idleTimer = setInterval(fn, 9000);
}

/* Contesto del turno in corso: serve a 🔊, a Bubo e al timer di inattività
   per ripetere la consegna completa (verso dell'animale incluso). */
let curCtx = null;

/** Ripete la consegna corrente (con l'eventuale verso), o un ripiego. */
function repeatPrompt(fallback) {
  if (curCtx && !curCtx._done && curCtx._replay) { curCtx._replay(); return; }
  const p = $("#prompt");
  if (p && p.textContent) Voice.say(p.textContent); else Voice.say(fallback);
}

/* --- costruzione del contesto passato a playRound --- */
function makeCtx(game, level, round, total, resolve) {
  const choices = [];
  let wrongs = 0, locked = false;

  const ctx = {
    el: $("#play"), level, round, total, game,
    shuffle, pick, rnd, range, sleep,

    /** Testo della richiesta: mostrato e pronunciato.
        opts.fx    -> funzione che suona un effetto (es. il verso dell'animale)
                      e ritorna la sua durata in secondi: la voce parla dopo.
        opts.fxSay -> testo pronunciato quando l'effetto è suonato davvero
                      (es. la domanda senza onomatopea, già "detta" dal verso). */
    prompt(text, opts) {
      const o = opts || {};
      $("#prompt").textContent = text;
      ctx._last = (o.say != null ? o.say : text);
      ctx._fx = o.fx || null;
      ctx._fxSay = (o.fxSay != null ? o.fxSay : ctx._last);
      ctx._replay = () => {
        const d = ctx._fx ? ctx._fx() : 0;
        if (d > 0) { Voice.stop(); setTimeout(() => Voice.say(ctx._fxSay), d * 1000 + 150); }
        else Voice.say(ctx._last);
      };
      if (o.silent !== true) ctx._replay();
      armIdle(ctx._replay);
    },
    say(t) { Voice.say(t); },

    /** Registra una tessera come risposta giusta o sbagliata.
        opts.say    -> frase aggiunta alla lode, per nominare ciò che il bambino
                       ha appena scelto ("Bravo! Questa faccia è contenta.")
        opts.stamp  -> simbolo dell'effetto a tutto schermo (default ⭐)
        opts.tapSay -> testo pronunciato subito al tocco, prima ancora di sapere
                       se giusto o sbagliato (es. il nome del numero toccato) */
    choice(node, isCorrect, opts) {
      const o = opts || {};
      choices.push({ node, isCorrect });
      node.addEventListener("click", () => {
        if (locked) return;
        const settle = () => {
          if (isCorrect) {
            locked = true;
            Sound.good(); FX.stamp(o.stamp || "⭐"); Mascot.react("happy");
            node.classList.add("right");
            choices.forEach(c => { c.node.classList.remove("hint"); if (c.node !== node) c.node.classList.add("dim"); });
            /* Il turno cambia quando la lode è finita di essere pronunciata,
               mai prima di 950 ms (serve a vedere la stella) né oltre il tetto:
               così la frase non viene tagliata e il gioco non resta mai fermo
               se la sintesi vocale manca o si blocca. */
            const t0 = Date.now(), cap = o.say ? 3600 : 1800;
            Voice.say(praiseText() + (o.say ? " " + o.say : ""),
              () => setTimeout(ctx.solved, Math.max(0, 950 - (Date.now() - t0))));
            setTimeout(ctx.solved, cap);
          } else {
            wrongs++;
            Sound.nope(); Mascot.react("oops");
            node.classList.remove("wrong"); void node.offsetWidth; node.classList.add("wrong");
            if (wrongs === 1) Voice.say(T.tryAgain);
            if (wrongs >= 2) {   // nessun fallimento: dopo 2 tentativi si accende l'aiuto
              choices.filter(c => c.isCorrect).forEach(c => c.node.classList.add("hint"));
              if (wrongs === 2) Voice.say(T.lookHint);
            }
          }
        };
        if (o.tapSay) Voice.say(o.tapSay, settle); else settle();
      });
    },

    /** Chiude il turno e riconsegna al motore gli errori fatti (0 = risposta
        corretta al primo tocco): è il dato con cui Adaptive decide il livello
        del turno successivo. onSolved(wrongs), se il gioco lo imposta, viene
        chiamato prima: serve ai giochi che vogliono osservare l'esito. */
    solved() {
      if (ctx._done) return; ctx._done = true; armIdle(null);
      if (ctx.onSolved) ctx.onSolved(wrongs);
      resolve(wrongs);
    }
  };
  curCtx = ctx;
  return ctx;
}

/* --- ciclo di partita --- */
async function startGame(game) {
  const token = S.token = Symbol("run");
  const total = game.rounds || 5;

  $("#screen").innerHTML =
    '<div class="stage">' +
      '<div class="promptbar"><span id="prompt"></span></div>' +
      '<div class="play" id="play"></div>' +
      '<div class="dots" id="dots"></div>' +
    '</div>';
  $(".promptbar").insertBefore(Mascot.make("mini"), $("#prompt"));   // Bubo "dice" la consegna

  /* ogni tocco nell'area di gioco azzera l'attesa del ripasso automatico:
     un bambino che sta toccando non è fermo, e il replay della consegna
     non deve interrompere quello che sta facendo */
  $("#play").addEventListener("click", () => {
    if (curCtx && !curCtx._done && curCtx._replay) armIdle(curCtx._replay);
  });

  const adapt = Adaptive.begin(game);
  for (let i = 0; i < total; i++) {
    if (S.token !== token) return;
    drawDots(i, total);
    $("#play").innerHTML = "";
    /* Il livello lo decide Adaptive turno per turno, in base alle risposte
       del turno precedente: si sale rispondendo bene, si scende (in silenzio)
       quando è servito l'aiuto. Vale per tutti i giochi, senza codice loro. */
    const wrongs = await new Promise(res => {
      S.resolve = res;
      game.playRound(makeCtx(game, adapt.level, i, total, res));
    });
    if (S.token !== token) return;
    Adaptive.update(game, wrongs || 0);
    addStar();
    await sleep(400);
  }
  if (S.token !== token) return;
  drawDots(total, total);
  celebrate(game);
}

function drawDots(done, total) {
  const d = $("#dots"); if (!d) return;
  d.innerHTML = "";
  for (let i = 0; i < total; i++) d.appendChild(mk("i", "dot" + (i < done ? " on" : "")));
}
function addStar() { S.stars++; $("#starcount").textContent = S.stars; }

function celebrate(game) {
  Daily.markPlayed(game.id);
  const locked = Daily.isLocked(game.id);      // false se il cap è disattivato dai genitori
  Sound.win(); FX.confetti(70);
  Voice.say((locked ? T.sayWinLocked : T.sayWin) + " " + pick(T.mascotCheer));
  const sh = mk("div", "sheet");
  sh.innerHTML =
    '<div class="sheetbox">' +
      '<div class="mslot"></div>' +
      '<h2>' + T.yay + '</h2><p>' + T.completed(T[game.titleKey]) + (locked ? T.seeTomorrow : "") + '</p>' +
      (locked ? '' : '<button class="bigbtn a" data-a="again">' + T.btnAgain + '</button>') +
      '<button class="bigbtn b" data-a="home">' + T.btnMore + '</button>' +
    '</div>';
  sh.querySelector(".mslot").appendChild(
    Mascot.make("huge", () => Voice.say(pick(T.mascotCheer))));
  sh.addEventListener("click", e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    sh.remove();
    if (b.dataset.a === "again") startGame(game); else renderHome();
  });
  document.body.appendChild(sh);
  Mascot.react("happy");
}

/* --- home --- */
function renderHome() {
  S.token = Symbol("home");
  if (S.resolve) { const r = S.resolve; S.resolve = null; r(); }   // sblocca un eventuale turno in corso
  curCtx = null;
  armIdle(null);
  Voice.stop();
  const allDone = KidBrain.games.every(g => Daily.isLocked(g.id));
  const line = allDone ? T.allDone : T.tapAGame;
  const wrap = mk("div", "home",
    '<h1 class="logo">GiocaMente</h1>' +
    '<div class="hello"></div>' +
    '<div class="gamegrid"></div>');
  /* la consegna arriva dalla mascotte, non da un sottotitolo anonimo */
  const hello = wrap.querySelector(".hello");
  hello.appendChild(Mascot.make("big", () => Voice.say(greetLine() + " " + line)));
  hello.appendChild(mk("div", "bubble", line));
  const grid = wrap.querySelector(".gamegrid");
  KidBrain.games.forEach(g => {
    const locked = Daily.isLocked(g.id);
    const t = mk("button", "gtile",
      '<span class="em">' + g.icon + '</span><span class="nm">' + T[g.titleKey] + '</span>' +
      (locked ? '<span class="done">' + T.doneBadge + '</span>' : ''));
    t.style.setProperty("--tint", g.tint);
    if (locked) t.classList.add("played");
    t.addEventListener("click", () => {
      if (Daily.isLocked(g.id)) {
        Sound.tap();
        Voice.say(T.alreadyDone);
        return;
      }
      Sound.tap(); startGame(g);
    });
    grid.appendChild(t);
  });
  $("#screen").innerHTML = "";
  $("#screen").appendChild(wrap);
  $("#prompt") && ($("#prompt").textContent = "");
}

   6. GIOCO 1 — Abbinamento forme e colori
   ========================================================= */
const SHAPES = {
  cerchio:   '<circle cx="50" cy="50" r="42"/>',
  quadrato:  '<rect x="10" y="10" width="80" height="80" rx="12"/>',
  triangolo: '<polygon points="50,8 94,90 6,90"/>',
  stella:    '<polygon points="50,4 61,37 96,37 68,58 79,93 50,72 21,93 32,58 4,37 39,37"/>',
  cuore:     '<path d="M50 92 C6 62 6 28 28 19 C40 14 50 22 50 31 C50 22 60 14 72 19 C94 28 94 62 50 92 Z"/>',
  luna:      '<path d="M64 6 A46 46 0 1 0 64 94 A37 37 0 1 1 64 6 Z"/>',
  rombo:     '<polygon points="50,4 96,50 50,96 4,50"/>',
  esagono:   '<polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/>'
};
const COLORS = [
  { n: "rosso", h: "#ef4444" }, { n: "blu", h: "#3b82f6" }, { n: "giallo", h: "#f5c211" },
  { n: "verde", h: "#22c55e" }, { n: "arancione", h: "#f97316" }, { n: "viola", h: "#a855f7" }
];
/* "pieno" = tinta unita; le altre due sono pattern SVG (righe diagonali, pois),
   una variabile visiva in più oltre a forma e colore. */
const TEXTURES = ["pieno", "righe", "pois"];
let texSeq = 0;
const svgShape = (s, h, tex) => {
  const shape = SHAPES[s];
  if (!tex || tex === "pieno") return '<svg viewBox="0 0 100 100" fill="' + h + '">' + shape + '</svg>';
  const id = "tex" + (texSeq++);
  const pattern = tex === "righe"
    ? '<pattern id="' + id + '" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<rect width="16" height="16" fill="' + h + '"/><rect width="8" height="16" fill="#fff" opacity=".55"/></pattern>'
    : '<pattern id="' + id + '" width="24" height="24" patternUnits="userSpaceOnUse">' +
        '<rect width="24" height="24" fill="' + h + '"/><circle cx="12" cy="12" r="6" fill="#fff" opacity=".65"/></pattern>';
  return '<svg viewBox="0 0 100 100"><defs>' + pattern + '</defs><g fill="url(#' + id + ')">' + shape + '</g></svg>';
};

/* Questo gioco è stato il banco di prova dell'adattività: ora quella
   logica vive nel motore (Adaptive) e vale per tutti i giochi. Qui resta
   solo maxLevel: 5, perché oltre i 3 livelli standard ci sono i due
   gradini con le texture (righe, pois). */
KidBrain.register({
  id: "match", titleKey: "matchTitle", icon: "🔷", tint: "var(--c2)", rounds: 8, maxLevel: 5,
  playRound(ctx) {
    const level = ctx.level;
    const shapes = shuffle(Object.keys(SHAPES));
    const cols = shuffle(COLORS);
    const texs = shuffle(TEXTURES);
    let target, options;

    if (level === 1) {                     // varia solo la FORMA
      const c = cols[0], tx = texs[0], s = shapes.slice(0, 3);
      target = { s: s[0], c, tx };
      options = s.map(x => ({ s: x, c, tx }));
    } else if (level === 2) {              // varia solo il COLORE
      const s = shapes[0], tx = texs[0], cs = cols.slice(0, 3);
      target = { s, c: cs[0], tx };
      options = cs.map(c => ({ s, c, tx }));
    } else if (level === 3) {              // varia forma E colore (4 opzioni)
      const tx = texs[0];
      target = { s: shapes[0], c: cols[0], tx };
      options = [
        { s: shapes[0], c: cols[0], tx }, { s: shapes[0], c: cols[1], tx },
        { s: shapes[1], c: cols[0], tx }, { s: shapes[1], c: cols[1], tx }
      ];
    } else if (level === 4) {              // varia solo la TEXTURE (pieno / righe / pois)
      const s = shapes[0], c = cols[0];
      target = { s, c, tx: texs[0] };
      options = texs.map(tx => ({ s, c, tx }));
    } else {                               // livello 5: forma, colore e texture insieme
      target = { s: shapes[0], c: cols[0], tx: texs[0] };
      options = [
        target,
        { s: shapes[1], c: cols[0], tx: texs[0] },
        { s: shapes[0], c: cols[1], tx: texs[0] },
        { s: shapes[0], c: cols[0], tx: texs[1] }
      ];
    }

    const model = mk("div", "model", svgShape(target.s, target.c.h, target.tx));
    const row = mk("div", "row");
    shuffle(options).forEach(o => {
      const t = mk("div", "tile", svgShape(o.s, o.c.h, o.tx));
      ctx.choice(t, o.s === target.s && o.c.n === target.c.n && o.tx === target.tx);
      row.appendChild(t);
    });
    ctx.el.appendChild(model);
    ctx.el.appendChild(row);
    ctx.prompt(T.matchPrompt);
  }
});

/* =========================================================
   7. GIOCO 2 — Memory a coppie
   ========================================================= */
const ANIMALS = [
  { e: "🐶", it: "il cane", en: "the dog" }, { e: "🐱", it: "il gatto", en: "the cat" }, { e: "🐰", it: "il coniglio", en: "the rabbit" },
  { e: "🐸", it: "la rana", en: "the frog" }, { e: "🐼", it: "il panda", en: "the panda" }, { e: "🦁", it: "il leone", en: "the lion" },
  { e: "🐷", it: "il maialino", en: "the piglet" }, { e: "🐵", it: "la scimmia", en: "the monkey" }, { e: "🐔", it: "la gallina", en: "the hen" },
  { e: "🦊", it: "la volpe", en: "the fox" }
];

KidBrain.register({
  id: "memory", titleKey: "memoryTitle", icon: "🐼", tint: "var(--c4)", rounds: 3,
  playRound(ctx) {
    const pairs = ctx.level >= 3 ? 4 : 3;
    const set = shuffle(ANIMALS).slice(0, pairs);
    const deck = shuffle(set.concat(set));
    const grid = mk("div", "mgrid");
    const narrow = matchMedia("(max-width:520px)").matches;  // su telefono sempre 3 colonne: carte più grandi
    grid.style.setProperty("--cols", (pairs === 3 || narrow) ? 3 : 4);
    let open = [], busy = false, found = 0;

    deck.forEach(a => {
      const card = mk("button", "mcard",
        '<span class="mface">' +
          '<span class="mside mback">🐾</span>' +
          '<span class="mside mfront">' + a.e + '</span>' +
        '</span>');
      card.dataset.k = a.e;
      card.addEventListener("click", () => {
        if (busy || card.classList.contains("up") || card.classList.contains("done")) return;
        Sound.flip();
        card.classList.add("up");
        Voice.say(a[LANG]);           // nomina l'animale a ogni carta girata, non solo alla coppia trovata
        open.push(card);
        if (open.length < 2) return;

        busy = true;
        const [x, y] = open;
        if (x.dataset.k === y.dataset.k) {
          setTimeout(() => {
            [x, y].forEach(c => { c.classList.remove("up"); c.classList.add("done"); });
            Sound.good(); FX.stamp(a.e); Mascot.react("happy");
            Voice.say(pick(T.foundPrefix) + a[LANG] + "!");
            open = []; busy = false; found++;
            if (found === pairs) setTimeout(() => ctx.solved(), 700);
          }, 380);
        } else {
          setTimeout(() => {                 // finestra generosa: i 3 anni sono lenti a osservare
            open.forEach(c => c.classList.remove("up"));
            open = []; busy = false;
          }, 1500);
        }
      });
      grid.appendChild(card);
    });

    ctx.el.appendChild(grid);
    ctx.prompt(T.memoryPrompt);
  }
});

/* =========================================================
   8b. GIOCO 4 — Le emozioni
   ---------------------------------------------------------
   Perché quest'ordine di livelli: a tre anni "contento" e
   "triste" sono le espressioni riconosciute per prime e con
   più sicurezza, la rabbia arriva poco dopo; sorpresa, paura
   e sonno restano a lungo ambigue e compaiono solo al livello 3.
   Livello 1 offre due sole scelte: il contrasto è già il
   contenuto del compito, non serve un distrattore in più.
   Ogni risposta giusta rinomina l'emozione ad alta voce: qui
   si allena il lessico emotivo, non soltanto la scelta.
   Il livello 4 (divertita, disgustata, infreddolita: sfumature
   più fini, con 4 scelte) non arriva col passare dei round come
   negli altri giochi, ma solo rispondendo bene: due risposte
   giuste al primo tocco di fila fanno salire di livello, come
   nel gioco delle forme. Il progresso resta in memoria fra una
   partita e l'altra della stessa sessione, mai una retrocessione.
   ========================================================= */
const EMOTIONS = [
  { e: "😀", lv: 1, it: "contenta", en: "happy" },
  { e: "😢", lv: 1, it: "triste", en: "sad" },
  { e: "😠", lv: 2, it: "arrabbiata", en: "angry" },
  { e: "😲", lv: 3, it: "sorpresa", en: "surprised" },
  { e: "😴", lv: 3, it: "addormentata", en: "sleepy" },
  { e: "😨", lv: 3, it: "spaventata", en: "scared" },
  { e: "😂", lv: 4, it: "divertita", en: "giggly" },
  { e: "🤢", lv: 4, it: "disgustata", en: "disgusted" },
  { e: "🥶", lv: 4, it: "infreddolita", en: "freezing" }
];
const EMO_MAX_LEVEL = 4;
const emoProgress = { level: 1, streak: 0 };

KidBrain.register({
  id: "emotion", titleKey: "emoTitle", icon: "😊", tint: "var(--c1)", rounds: 8,
  playRound(ctx) {
    if (ctx.round === 0) {
      emoProgress.level = Math.min(EMO_MAX_LEVEL, Math.max(emoProgress.level, Profile.minLevel()));
      emoProgress.streak = 0;
    }
    const level = emoProgress.level;
    const n = level === 1 ? 2 : (level >= 4 ? 4 : 3);
    const opts = shuffle(EMOTIONS.filter(x => x.lv <= level)).slice(0, n);
    const target = pick(opts);

    const row = mk("div", "row");
    opts.forEach(o => {
      const t = mk("div", "tile");
      t.appendChild(mk("span", "face", o.e));
      ctx.choice(t, o === target, { stamp: target.e, say: T.emoConfirm(target[LANG]) });
      row.appendChild(t);
    });
    ctx.el.appendChild(row);
    ctx.prompt(T.emoPrompt(target[LANG]));

    ctx.onSolved = wrongs => {
      if (wrongs === 0) {
        emoProgress.streak++;
        if (emoProgress.streak >= 2) {
          emoProgress.level = Math.min(EMO_MAX_LEVEL, emoProgress.level + 1);
          emoProgress.streak = 0;
        }
      } else {
        emoProgress.streak = 0;            // errore nel turno: livello mantenuto, serie azzerata
      }
    };
  }
});

/* =========================================================
   8c. GIOCO 5 — Conta oltre 10 (11-20)
   ---------------------------------------------------------
   Prima versione: si vedevano tutti i pallini insieme e si
   sceglieva il numero scritto "a occhio". Ma contare 15-20
   pallini identici tutti insieme è troppo difficile a
   quest'età, e il numero target veniva anche detto a voce
   nella consegna: il bambino non contava affatto, indovinava.
   Ora i dieci pallini di base sono già "fermi" in una griglia
   (un ten-frame, così si riconoscono a colpo d'occhio senza
   contarli uno per uno) e SOLO quelli oltre il 10 vanno
   toccati uno alla volta: ogni tocco fa sentire il numero
   successivo ("undici", "dodici", ...). Solo dopo aver
   davvero contato fino in fondo compaiono le tessere con i
   numeri scritti, per collegare la sequenza appena detta al
   numerale corrispondente.
   ========================================================= */
KidBrain.register({
  id: "count10", titleKey: "count10Title", icon: "🔢", tint: "var(--c5)", rounds: 5,
  playRound(ctx) {
    const MIN = 11;
    const max = ctx.level === 1 ? 14 : (ctx.level === 2 ? 17 : 20);
    const pool = shuffle(range(MIN, max));
    const target = pool[0];
    const nums = shuffle([target, pool[1], pool[2] != null ? pool[2] : (target === MIN ? max : MIN)]
      .filter((v, i, a) => v != null && a.indexOf(v) === i));
    const extra = target - 10;

    const board = mk("div", "c10board");
    const anchor = mk("div", "c10anchor");
    for (let i = 0; i < 10; i++) anchor.appendChild(mk("i", "pip"));
    board.appendChild(anchor);

    const extraWrap = mk("div", "c10extra");
    const extraPips = [];
    for (let i = 0; i < extra; i++) {
      const p = mk("div", "c10pip");
      extraWrap.appendChild(p);
      extraPips.push(p);
    }
    board.appendChild(extraWrap);

    const countLabel = mk("div", "c10count", "10");
    board.appendChild(countLabel);

    const row = mk("div", "row");

    ctx.el.appendChild(board);
    ctx.el.appendChild(row);
    ctx.prompt(T.count10CountPrompt);

    let counted = 10;
    extraPips.forEach(p => {
      p.addEventListener("click", () => {
        if (p.classList.contains("done") || counted >= target) return;
        p.classList.add("done");
        counted++;
        Sound.tap();
        countLabel.textContent = String(counted);
        Voice.say(T.numw10[counted - 11]);
        if (counted === target) {
          nums.forEach(k => {
            const t = mk("div", "tile c10choice");
            const face = mk("span", "face", String(k));
            face.style.fontWeight = "900";
            t.appendChild(face);
            ctx.choice(t, k === target, { tapSay: T.numw10[k - 11] });
            row.appendChild(t);
          });
          ctx.prompt(T.count10ChoosePrompt(target, T.numw10));
        }
      });
    });
  }
});

/* =========================================================
   8e. GIOCO 7 — La metà che manca (simmetria)
   ---------------------------------------------------------
   Nel modello si vede la metà sinistra di una figura, piena e
   colorata; la metà destra è solo un contorno tratteggiato da
   riempire, come la tessera mancante di un puzzle. Sotto, le
   metà destre fra cui scegliere. È il gioco d'incastro che a
   tre anni si conosce già dai puzzle di legno, portato sullo
   schermo: si ragiona sull'asse verticale, quello che i bambini
   colgono per primo (i volti e i corpi sono simmetrici così).
   Il contorno tratteggiato resta visibile a tutti i livelli:
   è la consegna stessa, non un aiuto da togliere — senza,
   il compito diventerebbe pura memoria della forma.
   Livelli: prima cambia solo la forma, poi forma e colore
   insieme, infine 4 scelte con distrattori vicini (stessa
   forma ma colore diverso, stesso colore ma forma diversa).
   ========================================================= */
/* Tutte le SHAPES tranne la luna sono simmetriche rispetto all'asse verticale. */
const SYM_SHAPES = ["cerchio", "quadrato", "triangolo", "stella", "cuore", "rombo", "esagono"];
let symSeq = 0;

/** Metà destra di una figura, centrata nella tessera di risposta. */
function svgHalfRight(s, h) {
  const id = "symc" + (symSeq++);
  return '<svg viewBox="0 0 100 100">' +
    '<defs><clipPath id="' + id + '"><rect x="50" y="-2" width="52" height="104"/></clipPath></defs>' +
    '<g transform="translate(-25 0)" clip-path="url(#' + id + ')" fill="' + h + '">' + SHAPES[s] + '</g>' +
  '</svg>';
}

/** Modello: metà sinistra piena, asse tratteggiato, metà destra solo contorno. */
function svgHalfModel(s, h) {
  const id = "symm" + (symSeq++);
  return '<svg viewBox="0 0 100 100">' +
    '<defs>' +
      '<clipPath id="' + id + 'l"><rect x="-2" y="-2" width="52" height="104"/></clipPath>' +
      '<clipPath id="' + id + 'r"><rect x="50" y="-2" width="52" height="104"/></clipPath>' +
    '</defs>' +
    '<g clip-path="url(#' + id + 'r)" fill="none" stroke="rgba(43,33,24,.30)" stroke-width="3" ' +
      'stroke-dasharray="7 8" stroke-linecap="round">' + SHAPES[s] + '</g>' +
    '<g clip-path="url(#' + id + 'l)" fill="' + h + '">' + SHAPES[s] + '</g>' +
    '<line x1="50" y1="4" x2="50" y2="96" stroke="rgba(43,33,24,.22)" stroke-width="2.5" ' +
      'stroke-dasharray="5 7" stroke-linecap="round"/>' +
  '</svg>';
}

KidBrain.register({
  id: "symmetry", titleKey: "symTitle", icon: "🦋", tint: "var(--c2)", rounds: 5,
  playRound(ctx) {
    const shapes = shuffle(SYM_SHAPES);
    const cols = shuffle(COLORS);
    let target, options;

    if (ctx.level === 1) {                 // varia solo la FORMA, colore fisso
      const c = cols[0];
      target = { s: shapes[0], c };
      options = shapes.slice(0, 3).map(s => ({ s, c }));
    } else if (ctx.level === 2) {          // varia FORMA e COLORE insieme: contrasto pieno
      target = { s: shapes[0], c: cols[0] };
      options = [target, { s: shapes[1], c: cols[1] }, { s: shapes[2], c: cols[2] }];
    } else {                               // 4 scelte, distrattori vicini
      target = { s: shapes[0], c: cols[0] };
      options = [
        target,
        { s: shapes[0], c: cols[1] },
        { s: shapes[1], c: cols[0] },
        { s: shapes[1], c: cols[1] }
      ];
    }

    const model = mk("div", "model", svgHalfModel(target.s, target.c.h));
    const row = mk("div", "row");
    shuffle(options).forEach(o => {
      const t = mk("div", "tile", svgHalfRight(o.s, o.c.h));
      ctx.choice(t, o.s === target.s && o.c.n === target.c.n, { stamp: "🦋", say: T.symDone });
      row.appendChild(t);
    });
    ctx.el.appendChild(model);
    ctx.el.appendChild(row);
    ctx.prompt(T.symPrompt);
  }
});

/* =========================================================
   8g. GIOCO 9 — Completa la filastrocca
   ---------------------------------------------------------
   Bubo recita una filastrocca (o un proverbio, ai livelli
   alti) lasciando in sospeso l'ultima parola: la rima stessa
   suggerisce la risposta, ed è proprio quella sensibilità
   fonologica che qui si allena. Le parole fra cui scegliere
   sono scritte, ma a tre anni non si legge: toccarne una la
   fa leggere ad alta voce E la seleziona; il segno verde ✔
   conferma. È l'unico gioco a due tempi (scegli, poi conferma):
   serve a poter ascoltare tutte le parole con calma prima di
   rispondere, senza che il primo tocco conti come risposta.
   Il feedback (lode, aiuto dopo 2 errori, nessun fallimento)
   ricalca a mano quello di ctx.choice, che qui non basta
   perché la correttezza si giudica solo alla conferma.
   Le filastrocche non si traducono: per ogni lingua c'è il
   suo repertorio (Stella stellina... / Twinkle twinkle...).
   ========================================================= */
const RIME = {
  it: [
    { lv: 1, pre: "Stella stellina, la notte si avvicina: la fiamma traballa, la mucca è nella…", ans: "stalla", d: ["palla", "luna"] },
    { lv: 1, pre: "Giro giro tondo, casca il mondo, casca la terra, tutti giù per…", ans: "terra", d: ["cielo", "casa"] },
    { lv: 1, pre: "Nella vecchia fattoria, ia-ia-…", ans: "oh", d: ["bau", "miao"] },
    { lv: 2, pre: "La Befana vien di notte, con le scarpe tutte…", ans: "rotte", d: ["nuove", "pulite"] },
    { lv: 2, pre: "Farfallina bella e bianca, vola vola e mai si…", ans: "stanca", d: ["ferma", "siede"] },
    { lv: 2, pre: "Ambarabà ciccì coccò, tre civette sul…", ans: "comò", d: ["divano", "tetto"] },
    { lv: 3, pre: "Chi va piano, va sano e va…", ans: "lontano", d: ["veloce", "vicino"] },
    { lv: 3, pre: "Rosso di sera, bel tempo si…", ans: "spera", d: ["vede", "sogna"] }
  ],
  en: [
    { lv: 1, pre: "Twinkle twinkle little star, how I wonder what you…", ans: "are", d: ["do", "see"] },
    { lv: 1, pre: "Old MacDonald had a farm, ee-i-ee-i-…", ans: "oh", d: ["moo", "woof"] },
    { lv: 1, pre: "Rain, rain, go away, come again another…", ans: "day", d: ["night", "week"] },
    { lv: 2, pre: "Baa baa black sheep, have you any…", ans: "wool", d: ["milk", "bread"] },
    { lv: 2, pre: "Row, row, row your boat, gently down the…", ans: "stream", d: ["road", "hill"] },
    { lv: 2, pre: "Humpty Dumpty sat on a wall, Humpty Dumpty had a great…", ans: "fall", d: ["nap", "laugh"] },
    { lv: 3, pre: "The itsy bitsy spider climbed up the water…", ans: "spout", d: ["slide", "tree"] },
    { lv: 3, pre: "An apple a day keeps the doctor…", ans: "away", d: ["happy", "near"] }
  ]
};

KidBrain.register({
  id: "rhyme", titleKey: "rimeTitle", icon: "🎤", tint: "var(--c4)", rounds: 5,
  playRound(ctx) {
    const n = ctx.level === 1 ? 2 : 3;
    const rhyme = pick(RIME[LANG].filter(r => r.lv <= ctx.level));
    const words = shuffle([rhyme.ans].concat(rhyme.d.slice(0, n - 1)));
    let sel = null, wrongs = 0, locked = false;

    const row = mk("div", "row");
    const tiles = [];
    words.forEach(w => {
      const t = mk("div", "tile wtile");
      t.appendChild(mk("span", "word", w));
      t.addEventListener("click", () => {
        if (locked) return;
        Sound.tap();
        tiles.forEach(x => x.classList.toggle("sel", x === t));
        sel = w;
        go.style.visibility = "visible";
        Voice.say(w);                    // la parola si ascolta: a tre anni non si legge
      });
      tiles.push(t); row.appendChild(t);
    });

    const goRow = mk("div", "row");
    const go = mk("button", "gobtn", "✔");
    go.type = "button";
    go.setAttribute("aria-label", "OK");
    go.style.visibility = "hidden";      // compare solo dopo la prima scelta
    go.addEventListener("click", () => {
      if (locked || !sel) return;
      if (sel === rhyme.ans) {
        locked = true;
        Sound.good(); FX.stamp("🎉"); Mascot.react("happy");
        tiles.forEach(x => {
          x.classList.remove("hint");
          x.classList.toggle("right", x.textContent === rhyme.ans);
          x.classList.toggle("dim", x.textContent !== rhyme.ans);
        });
        go.classList.add("dim");
        /* la lode ripete la filastrocca intera, stavolta completa */
        const t0 = Date.now();
        Voice.say(praiseText() + " " + rhyme.pre.replace(/…$/, " " + rhyme.ans + "!"),
          () => setTimeout(ctx.solved, Math.max(0, 950 - (Date.now() - t0))));
        setTimeout(ctx.solved, 7000);    // tetto: mai fermi se la sintesi vocale manca
      } else {
        wrongs++;
        Sound.nope(); Mascot.react("oops");
        const st = tiles.find(x => x.classList.contains("sel"));
        if (st) { st.classList.remove("wrong"); void st.offsetWidth; st.classList.add("wrong"); }
        if (wrongs === 1) Voice.say(T.tryAgain);
        if (wrongs >= 2) {               // nessun fallimento: dopo 2 tentativi si accende l'aiuto
          tiles[words.indexOf(rhyme.ans)].classList.add("hint");
          if (wrongs === 2) Voice.say(T.lookHint);
        }
      }
    });
    goRow.appendChild(go);

    ctx.el.appendChild(row);
    ctx.el.appendChild(goRow);
    /* al primo turno la consegna spiega anche il gesto (tocca, ascolta, conferma) */
    ctx.prompt(rhyme.pre, ctx.round === 0 ? { say: rhyme.pre + " " + T.rimeHow } : undefined);
  }
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** Riga di scelta della voce del dispositivo, con tasto "Prova". */
function voiceRow() {
  let opts = '<option value="">' + T.pVoiceAuto + '</option>';
  Voice.list().forEach(v => {
    const sel = Voice.overrideURI === v.voiceURI ? " selected" : "";
    opts += '<option value="' + esc(v.voiceURI) + '"' + sel + '>' + esc(v.name + " (" + v.lang + ")") + '</option>';
  });
  return (
    '<div class="techrow">' +
      '<div class="techhead"><span>' + T.pVoicePick + '</span></div>' +
      '<div class="techctl">' +
        '<select class="voicesel" id="voiceSel">' + opts + '</select>' +
        '<button class="testbtn" data-test="voicepick" aria-label="' + T.ariaTestVoicePick + '">' + T.pTest + '</button>' +
      '</div>' +
    '</div>'
  );
}

  });
  sh.addEventListener("click", e => {
    const ab = e.target.closest("[data-age]");

      const wasSel = ab.classList.contains("sel");     // ritocca la fascia già scelta per annullarla
      Profile.setAge(wasSel ? "" : ab.dataset.age);

      Sound.tap();
      return;

    if (e.target.closest("[data-test]")) { Voice.test(); return; }
    const t = e.target.closest("[data-t]");

      const k = t.dataset.t;

    }
  });

}

  $("#btnHome").addEventListener("click", () => { Sound.tap(); renderHome(); });
  $("#btnRepeat").addEventListener("click", () => repeatPrompt(T.chooseGame));

  $("#btnLang").addEventListener("click", () => {
    Sound.tap();
    applyLang(LANG === "it" ? "en" : "it");
    Voice.say(T.langSet);                     // conferma udibile nella lingua appena scelta
  });

  const gear = $("#btnGear");
  let hold = null;
  gear.addEventListener("pointerdown", () => {
    gear.classList.add("holding");
    hold = setTimeout(() => { gear.classList.remove("holding"); openParents(); }, 1200);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
    gear.addEventListener(ev, () => { clearTimeout(hold); gear.classList.remove("holding"); }));

  renderHome();
  if (!Profile.isOnboarded()) openWelcome();   // dispositivo nuovo (o localStorage svuotato): si presenta e chiede nome/età

  /* offline: registra il service worker (solo su https; su file:// non serve) */
  if ("serviceWorker" in navigator && location.protocol === "https:")
    navigator.serviceWorker.register("sw.js").catch(() => {});
})();

/* =========================================================
   COME AGGIUNGERE UN NUOVO GIOCO
   ---------------------------------------------------------
   Basta un blocco come questo, in qualsiasi punto dopo la
   definizione di KidBrain. Nessuna modifica al motore.

   KidBrain.register({
     id: "colori",
     titleKey: "coloriTitle",          // aggiungi la chiave a STR.it e STR.en
     icon: "🎨",
     tint: "var(--c5)",
     rounds: 5,                        // opzionale, default 5
     maxLevel: 3,                      // opzionale, default 3 (vedi Adaptive)
     playRound(ctx) {
       // ctx.el      -> area di gioco già svuotata
       // ctx.level   -> 1..maxLevel, ADATTIVO (stile test GMAT): sale con le
       //   risposte esatte al primo tocco (2 di fila), scende in silenzio
       //   quando serve l'aiuto. Il gioco deve solo leggerlo.
       // ctx.round / ctx.total
       // ctx.prompt(testo)         mostra + pronuncia la richiesta
       // ctx.say(testo)            pronuncia soltanto
       // ctx.choice(nodo, giusto, opts)  gestisce tap, feedback, aiuto, fine turno
       //   opts.say   -> frase aggiunta alla lode ("Bravo! Sono tre mele.")
       //   opts.stamp -> simbolo dell'effetto a tutto schermo (default ⭐)
       // ctx.solved()              chiude il turno a mano (es. memory)
       // ctx.onSolved = wrongs =>  facoltativo: chiamato alla chiusura del turno
       //   con gli errori fatti (0 = giusto al primo tocco), se un gioco vuole
       //   osservare l'esito. L'avanzamento di livello lo fa già il motore.
       // ctx.shuffle / pick / rnd / range / sleep

       const bersaglio = ctx.pick(COLORS);
       ctx.shuffle(COLORS).slice(0, 3).concat([bersaglio]).forEach(c => {
         const t = mk("div", "tile");
         t.style.background = c.h;
         ctx.choice(t, c.n === bersaglio.n);
         ctx.el.appendChild(t);
       });
       ctx.prompt(T.coloriPrompt(bersaglio.n));
     }
   });

   Il cap "una partita al giorno" vale automaticamente anche per
   i nuovi giochi: è agganciato all'id, nessun codice da aggiungere.

   Regole di design da rispettare nei nuovi giochi:
   1. solo TAP (niente drag, niente multi-touch, niente doppio tap)
   2. max 3 opzioni ai livelli 1-2, max 4 al livello 3
   3. nessun timer, nessun punteggio negativo, nessuna schermata di sconfitta
   4. la richiesta deve essere comprensibile ascoltandola, senza leggere
      e ogni testo visibile o parlato deve passare da T, mai scritto a mano:
      il tasto lingua in barra cambia T a caldo
   5. usa la classe .tile per le risposte: garantisce il target >= 2 cm
   ========================================================= */
